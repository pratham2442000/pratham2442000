  industry_preferences:
    preferred_domains:
    - name: AI & Compound AI Systems
      weight: 15.0
      patterns:
      - \b(rag|retrieval|compound\s+ai|genai|llm|foundation\s+models)\b
    - name: Autonomous Driving & Robotics
      weight: 15.0
      patterns:
      - \b(autonomous|lidar|ros|robotics|perception|sensor\s+fusion|self-driving)\b
    - name: Motorsport & High Performance
      weight: 15.0
      patterns:
      - \b(formula\s+1|f1|motorsport|racing)\b
    - name: Quantitative Trading & Low Latency
      weight: 12.0
      patterns:
      - \b(trading|quant|market\s+making|hft|algorithmic\s+trading)\b
    - name: Developer Tools & Cloud Infrastructure
      weight: 10.0
      patterns:
      - \b(developer\s+tools|infrastructure|platform\s+engineering|cloud\s+native)\b
    excluded_domains:
    - name: Gambling & Sports Betting
      weight: -30.0
      patterns:
      - \b(casino|gambling|betting|sportsbook|poker)\b
    - name: Pure Marketing & Sales Agencies
      weight: -40.0
      patterns:
      - \b(seo\s+agency|lead\s+generation|advertising\s+sales)\b
  company_size_preference:
  - scaleup
  - enterprise
  - midsize
  - startup
  tech_stack_alignment:
    preferred_stacks:
    - Python
    - PyTorch
    - C++
    - Docker
    - Kubernetes
    - FastAPI
    - Linux
    anti_patterns:
    - PHP
    - Wordpress
    - Ruby on Rails
    - Salesforce Apex
    anti_pattern_penalty: -20.0
    anti_pattern_regexes:
    - \b(php|wordpress|joomla|drupal|ruby\s+on\s+rails|apex|magento)\b
evaluation_and_scoring_rubric:
  base_score: 15.0
  min_match_threshold: 40.0
  max_score: 99.0
  component_weights:
    role_title_match: 0.35
    skills_match: 0.3
    location_match: 0.2
    company_and_domain: 0.15
  penalties:
  - name: Frontend / Mobile Specialization
    deduction: -25.0
    pattern: \b(frontend|front-end|react\s+native|ios|android|swift|flutter)\b
    reason: Domain mismatch (Frontend/Mobile focus deducted 25 pts)
  - name: Non-Technical / Administrative
    deduction: -50.0
    pattern: \b(sales|marketing|recruiter|hr|talent|accountant|legal|counsel)\b
    reason: Non-technical domain penalty (deducted 50 pts)
  cover_letter_templates:
  - template_id: motorsport_f1
    title: 10. FORMULA 1 & MOTORSPORT
    priority: 100
    trigger_patterns:
    - \b(f1|formula\s+1|motorsport|racing|race\s+car)\b
    letter_file_reference: letter_bodies.tex:10
    talking_points:
    - Formula Student Team Delft Autonomous Driving Engineer
    - Real-time LIDAR perception under tight compute limits
    - High-performance telemetry data pipelines
  - template_id: high_tech_embedded
    title: 9. HIGH-TECH & EMBEDDED SYSTEMS
    priority: 90
    trigger_patterns:
    - \b(embedded|semiconductor|firmware|hardware|c\+\+|mechatronics)\b
    letter_file_reference: letter_bodies.tex:9
    talking_points:
    - Real-time C++ systems and sensor integration
    - Computer architecture and low-level Linux administration
  - template_id: computer_vision_perception
    title: 8. COMPUTER VISION & PERCEPTION
    priority: 80
    trigger_patterns:
    - \b(perception|lidar|autonomous|computer\s+vision|robotics|sensor\s+fusion)\b
    letter_file_reference: letter_bodies.tex:8
    talking_points:
    - Formula Student autonomous perception pipeline
    - Point cloud clustering, YOLO object detection, 30+ Hz inference
  - template_id: ai_engineer_builder
    title: 7. AI ENGINEER (0-to-1 Builder)
    priority: 70
    trigger_patterns:
    - \b(ai\s+engineer|forward\s+deployed|applied\s+ai|compound\s+ai|genai|llm\s+engineer)\b
    letter_file_reference: letter_bodies.tex:7
    talking_points:
    - Master's thesis on Compound AI systems and RAG scaling laws
    - Deploying multi-stage LLM pipelines into production
  - template_id: mlops_platform
    title: 6. MLOPS & PLATFORM ENGINEER
    priority: 60
    trigger_patterns:
    - \b(mlops|devops|platform|kubernetes|docker|infrastructure|observability)\b
    letter_file_reference: letter_bodies.tex:6
    talking_points:
    - Bare-metal Linux homelab, Tailscale mesh networking
    - Kubernetes, Docker, SLURM HPC orchestration
  - template_id: software_engineer_backend
    title: 5. SOFTWARE ENGINEER (Backend/Core)
    priority: 50
    trigger_patterns:
    - \b(software\s+engineer|backend|core|systems\s+engineer|python\s+developer|python\s+engineer)\b
    letter_file_reference: letter_bodies.tex:5
    talking_points:
    - Production Python/FastAPI and C++ backends
    - Robust API design, asynchronous processing, and SQL data modeling
  - template_id: data_scientist
    title: 4. DATA SCIENTIST
    priority: 40
    trigger_patterns:
    - \b(data\s+scientist|analytics|data\s+analyst)\b
    letter_file_reference: letter_bodies.tex:4
    talking_points:
    - Statistical modeling and exploratory data analysis
    - Empirical benchmarking across large datasets
  - template_id: machine_learning_engineer
    title: 3. MACHINE LEARNING ENGINEER
    priority: 30
    trigger_patterns:
    - \b(machine\s+learning|ml\s+engineer|deep\s+learning)\b
    letter_file_reference: letter_bodies.tex:3
    talking_points:
    - PyTorch model training, fine-tuning, and ONNX export
